spring:
  application:
    name: notification-service

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /notification-service/v3/api-docs/swagger-config
    url: /notification-service/v3/api-docs
  api-docs:
    path: /v3/api-docs

app:
  kafka:
    topics:
      payment-confirmed: payment-service.payment-confirmed
      payment-failed: payment-service.payment-failed
    dlt-topic:
      notification-service: notification.service.dlt