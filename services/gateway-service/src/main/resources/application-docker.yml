spring:
  main:
    json.log.enabled: true
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

        - id: reservation-service
          uri: http://reservation-service:8082
          predicates:
            - Path=/api/reservations/**

        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**

        - id: user-service-swagger
          uri: http://user-service:8081
          predicates:
            - Path=/user-service/swagger-ui/**,/user-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: reservation-service-swagger
          uri: http://reservation-service:8082
          predicates:
            - Path=/reservation-service/swagger-ui/**,/reservation-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: payment-service-swagger
          uri: http://payment-service:8083
          predicates:
            - Path=/payment-service/swagger-ui/**,/payment-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/api/notifications/**

        - id: notification-service-swagger
          uri: http://notification-service:8080
          predicates:
            - Path=/notification-service/swagger-ui/**,/notification-service/v3/api-docs/**
          filters:
            - StripPrefix=1